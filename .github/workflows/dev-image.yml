name: Dev image

# Fork-only, not meant for upstream. Builds the add-on on GitHub's runners and
# pushes ghcr.io/<owner>/claude-terminal-dev-<arch>:<version>-dev.<sha>, so a
# test install on a slow box (Odroid, Pi) pulls the image instead of building
# it. The add-on copy from scripts/dev-deploy.sh then only needs
#   version: "<version>-dev.<sha>"
#   image: ghcr.io/<owner>/claude-terminal-dev-{arch}
on:
  push:
    branches: ['dev/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, platform: linux/amd64, runner: ubuntu-latest }
          - { arch: aarch64, platform: linux/arm64, runner: ubuntu-24.04-arm }
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Image name and version
        id: meta
        run: |
          version=$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\}.*/\1/p' claude-terminal/config.yaml | head -1)
          echo "version=${version}-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/claude-terminal-dev-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: claude-terminal
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_VERSION=${{ steps.meta.outputs.version }}
            BUILD_ARCH=${{ matrix.arch }}
          # Links the package to this repository instead of upstream
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          push: true
          pull: true
          cache-from: type=gha,scope=dev-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=dev-${{ matrix.arch }}

      - name: Summary
        run: |
          {
            echo "Pushed \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}\`"
            echo
            echo "For the dev add-on's config.yaml:"
            echo '```yaml'
            echo "version: \"${{ steps.meta.outputs.version }}\""
            echo "image: ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/claude-terminal-dev-{arch}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
